# Example: N-Bin Spectroscopic Analysis
#
# This configuration divides the wavelength range into 5 evenly-spaced bins
# and performs independent Fourier series fitting on each bin.

[data]
input_path = "./examples/example_input.csv"
object_name = "ZTFJ0038+2030"
instrument = "PRISM"

[observational_parameters]
P_published = 0.4319208
t0_published = 59045.485194

[wavelength_binning]
# Divide into 5 equal bins
mode = "n_bins"
n_bins = 5
wave_min = 4.5
wave_max = 5.0

[fitting]
method = "powell"
n_trials = 2000
use_random_sampling = true

[output]
output_dir = "./output_5bins"
save_binned_plots = true   # One 9-panel plot per bin
save_bic_table = true      # CSV with BIC for all models, all bins
save_heatmap = true        # Heatmap showing BIC trends across wavelength
save_best_fit_plot = true
show_plots = true

[styling]
theme = "light"
