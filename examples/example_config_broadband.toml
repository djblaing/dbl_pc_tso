# Example: Broadband Fitting
# 
# This configuration fits Fourier series models to broadband flux
# (averaged across entire wavelength range).

[data]
input_path = "./examples/example_input.csv"
object_name = "ZTFJ0038+2030"
instrument = "PRISM"

[observational_parameters]
P_published = 0.4319208
t0_published = 59045.485194

[wavelength_binning]
mode = "broadband"

[fitting]
method = "powell"
n_trials = 2000
use_random_sampling = true

[output]
output_dir = "./output_broadband"
save_binned_plots = true
save_bic_table = true
save_heatmap = false  # Only useful for multiple bins
save_best_fit_plot = true
show_plots = true

[styling]
theme = "light"
