# Example: Custom Wavelength Regions
#
# This configuration uses hand-defined wavelength regions based on
# molecular feature windows (e.g., CO2-related bands).

[data]
input_path = "./examples/example_input.csv"
object_name = "ZTFJ0038+2030"
instrument = "PRISM"

[observational_parameters]
P_published = 0.4319208
t0_published = 59045.485194

[wavelength_binning]
mode = "custom_regions"

# Define custom wavelength regions
regions = [
    ["CO2_feature", 4.50, 4.60],
    ["CO2_shoulder", 4.60, 4.75],
    ["continuum_ref", 4.75, 4.90],
]

[fitting]
method = "powell"
n_trials = 2000
use_random_sampling = true

[output]
output_dir = "./output_custom_regions"
save_binned_plots = true
save_bic_table = true
save_heatmap = true
save_best_fit_plot = true
show_plots = true

[styling]
theme = "light"
